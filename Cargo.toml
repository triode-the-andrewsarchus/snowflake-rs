[package]
name = "snowflake"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "snowflake"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
